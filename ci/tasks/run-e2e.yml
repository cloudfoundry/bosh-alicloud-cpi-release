---
platform: linux

image_resource:
  type: registry-image
  source:
    repository: bosh/integration
    tag: main

inputs:
  - name: bosh-cpi-src
  - name: environment
  - name: stemcell
  - name: heavy-stemcell
  - name: bosh-cli
  - name: director-state
  - name: jq-blob
  - name: aliyun-cli

run:
  path: bosh-cpi-src/ci/tasks/run-e2e.sh

params:
  BOSH_DEBUG_LEVEL: info
  # Assumed from the Concourse worker's instance role; no access key is passed in.
  provision_role_arn: ""
  region: ""