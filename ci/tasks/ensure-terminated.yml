---
platform: linux
image_resource:
  type: registry-image
  source:
    repository: foundationalinfrastructure/gce-cpi-release
inputs:
  - name: bosh-cpi-src
  - name: environment
  - name: jq-blob
  - name: aliyun-cli
run:
  path: bosh-cpi-src/ci/tasks/ensure-terminated.sh
params:
  # Assumed from the Concourse worker's instance role; no access key is passed in.
  cleanup_role_arn:           ""
  ALICLOUD_DEFAULT_REGION:    ""