---
platform: linux
image_resource:
  type: registry-image
  source:
    repository: foundationalinfrastructure/gce-cpi-release
inputs:
  - name: bosh-cpi-src
  - name: stemcell
  - name: environment
  - name: aliyun-cli
run:
  path: bosh-cpi-src/ci/tasks/run-integration.sh
params:
  # Assumed from the Concourse worker's instance role; no access key is passed in.
  test_role_arn:         ""
  CPI_CREDENTIAL_SOURCE: static
