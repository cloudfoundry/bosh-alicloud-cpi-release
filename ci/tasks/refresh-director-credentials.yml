---
platform: linux

image_resource:
  type: registry-image
  source:
    repository: bosh/integration
    tag: main

inputs:
  - name: bosh-cpi-src
  - name: director-state

outputs:
  - name: director-state

run:
  path: bosh-cpi-src/ci/tasks/refresh-director-credentials.sh
params:
  # Assumed from the Concourse worker's instance role; no access key is passed in.
  provision_role_arn: ""
  region: ""
