---
platform: linux

image_resource:
  type: registry-image
  source:
    repository: foundationalinfrastructure/gce-cpi-release

inputs:
  - name: bosh-cpi-src
  - name: aliyun-cli

outputs:
  - name: environment

run:
  path: bosh-cpi-src/ci/tasks/put-environment.sh
params:
  region: ""
  env_name: ""
  public_key: ""
  delete_on_failure: false
  generate_random_name: false
  action: ""
  # Assumed from the Concourse worker's instance role; no access key is passed in.
  terraform_role_arn: ""
  director_role_name: ""
  terraform_source: ""
  output_module: ""
  remote_state_region: ""
  remote_state_bucket: ""
  remote_state_file_path: ""
  remote_state_file_name: ""
