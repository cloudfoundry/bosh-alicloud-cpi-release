networks:
  - name: private
    type: dynamic
    cloud_properties:
      vswitch_id: ((vswitch_id))
      security_group_id: ((security_group_id))
  - name: vip
    type: vip

vm_types:
  - name: default
    cloud_properties: &default_cloud_properties
      instance_type: ecs.sn2.medium
      availability_zone: ((zone))
  - name: slb_registration_pool
    cloud_properties:
      <<: *default_cloud_properties
      slbs: [((slb))]
  - name: spot_instance_pool
    cloud_properties:
      <<: *default_cloud_properties
      instance_type: ecs.sn1ne.large
      spot_strategy: "SpotWithPriceLimit"
      spot_price_limit: 0.10 # 10x the normal bid price
  - name: nvme_upgrade_legacy
    cloud_properties:
      instance_type: ((legacy_instance_type))
      availability_zone: ((zone))
      system_disk:
        size: 40960
        category: cloud_efficiency
      ephemeral_disk:
        size: 40960
        category: cloud_efficiency
  - name: nvme_upgrade_target
    cloud_properties:
      instance_type: ((nvme_instance_type))
      availability_zone: ((zone))
      system_disk:
        size: 40960
        category: cloud_essd
      ephemeral_disk:
        size: 40960
        category: cloud_essd

disk_types:
  - name: nvme_upgrade_legacy
    disk_size: 40960
    cloud_properties:
      category: cloud_efficiency
  - name: nvme_upgrade_target
    disk_size: 40960
    cloud_properties:
      category: cloud_essd
  - name: nvme_upgrade_target_smaller
    disk_size: 20480
    cloud_properties:
      category: cloud_essd

compilation:
  reuse_compilation_vms: true
  workers: 1
  network: private
  cloud_properties:
    instance_type: ecs.sn2.medium
    availability_zone: ((zone))
